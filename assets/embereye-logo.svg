  <circle cx="86" cy="332" r="11" fill="#FFD27A"/>
  <circle cx="86" cy="332" r="22" fill="none" stroke="#FFD27A" stroke-opacity="0.28" stroke-width="5"/>

  <path d="M256 116c46 68 90 96 90 162a90 90 0 0 1-180 0c0-42 24-68 44-104 6 30 20 44 32 50-6-34-4-72 14-108z"
