  <rect width="512" height="512" rx="112" fill="#0C0B0E"/>
  <circle cx="256" cy="280" r="156" fill="url(#glow)"/>

  <ellipse cx="256" cy="268" rx="198" ry="86" fill="none" stroke="url(#orbit)" stroke-width="9"
