<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="embereyeTitle embereyeDesc">
  <title id="embereyeTitle">EmberEye</title>
  <desc id="embereyeDesc">A stylized ember flame containing an eye, encircled by a satellite orbit.</desc>
  <defs>
    <linearGradient id="ember" x1="0.15" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#8C2410"/>
      <stop offset="0.42" stop-color="#E2491B"/>
      <stop offset="0.76" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FFD27A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#FF6A2A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6A2A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB25E" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFB25E" stop-opacity="0.92"/>
