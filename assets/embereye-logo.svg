  <ellipse cx="256" cy="294" rx="48" ry="27" fill="#0C0B0E"/>
  <circle cx="256" cy="294" r="18" fill="url(#core)"/>
  <circle cx="256" cy="294" r="8" fill="#0C0B0E"/>
  <circle cx="250" cy="287" r="3.5" fill="#FFF3D6" fill-opacity="0.9"/>
