# Caddy sanitizes X-Forwarded-For by default; in the documented deployment
# this is the real visitor IP, not the localhost reverse-proxy address. Direct
# access without that header falls back to the socket peer address.
map $http_x_forwarded_for $api_limit_client {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $api_limit_client zone=api_per_client:10m rate=20r/s;
limit_req_status 429;
