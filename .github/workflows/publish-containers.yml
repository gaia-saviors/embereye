name: Publish GHCR Container Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and publish ${{ matrix.component }} image
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ""
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: "VITE_API_BASE=/api"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stable version tag and identify latest
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          current_tag = os.environ["GITHUB_REF_NAME"]
          current = pattern.fullmatch(current_tag)
          if current is None:
              sys.exit(f"Refusing non-stable image tag: {current_tag}")
          versions = []
          for tag in subprocess.check_output(["git", "tag", "--list"], text=True).splitlines():
              match = pattern.fullmatch(tag)
              if match:
                  versions.append((tuple(map(int, match.groups())), tag))
          newest = max(versions)[0]
          is_latest = tuple(map(int, current.groups())) == newest
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_latest={str(is_latest).lower()}\n")
          print(f"{current_tag}: latest={is_latest}")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/embereye-${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.release.outputs.is_latest }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true
