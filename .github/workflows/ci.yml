name: EmberEye CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run pytest test suite
        env:
          PYTHONPATH: backend
          TESTING: "1"
        run: |
          pytest tests -v

  frontend-build:
    name: Frontend Typecheck & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript type checking
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build frontend production bundle
        working-directory: ./frontend
        run: npm run build

  docker-smoke-test:
    name: Docker Compose Build & Smoke Test
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start stack in test mode
        env:
          SEED_SCALE: "0.05"
        run: |
          docker compose up -d

      - name: Healthcheck smoke probe
        run: |
          for i in {1..45}; do
            if curl -s http://localhost:8000/api/health | grep -q '"status":"ok"'; then
              echo "FastAPI backend healthy!"
              curl -s http://localhost:8080 | grep -q "EmberEye" && echo "Frontend healthy!"
              exit 0
            fi
            echo "Waiting for stack... ($i/45)"
            sleep 2
          done
          echo "Stack health check timed out!"
          docker compose logs
          exit 1

      - name: Tear down stack
        if: always()
        run: |
          docker compose down -v
